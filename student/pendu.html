<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Pendu</title>
    <link rel="stylesheet" href="student-style.css">
</head>
<body>
    <main class="card">
        <div class="top">
            <h1>Pendu</h1>
            <a href="index.html" class="back">Retour</a>
        </div>
        <p class="sub">Devine le mot lettre par lettre avant 7 erreurs.</p>

        <div class="status">
            <span>Erreurs: <span id="Erreurs">0</span>/7</span>
            <span>Mot: <span id="LongueurMot">0</span> lettres</span>
        </div>

        <div id="MotAffiche" class="word"></div>

        <div class="actions">
            <input id="Lettre" maxlength="1" placeholder="Lettre">
            <div style="display:flex;gap:8px">
                <button class="primary" onclick="proposer()">Proposer</button>
                <button class="secondary" onclick="nouvellePartie()">Rejouer</button>
            </div>
        </div>

        <div id="Lettres" class="letters"></div>
        <div id="Message" class="msg"></div>
    </main>

    <script>
    // ============================================================
    // Pendu JS - variante eleve
    // ============================================================

    function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    const mots = ["SOLEIL", "NUAGE", "FLEUR", "ROUTE", "LAMPE", "CHIEN", "PLAGE", "LIVRE"];

    let motSecret = "";
    let lettresTrouvees = [];
    let lettresEssayees = [];
    let erreurs = 0;
    let fini = false;

    function choisirMot() {
        // A COMPLETER:
        // Retourne un mot au hasard dans le tableau mots.
        return "SOLEIL";
    }

    function afficherMessage(texte, type) {
        let message = document.getElementById("Message");
        message.textContent = texte;
        message.className = "msg " + type;
    }

    function afficherMot() {
        let zone = document.getElementById("MotAffiche");
        zone.innerHTML = "";

        for (let i = 0; i < motSecret.length; i++) {
            let lettre = motSecret[i];
            let span = document.createElement("span");

            // A COMPLETER:
            // Si lettresTrouvees contient la lettre, affiche la lettre.
            // Sinon, affiche "_".
            span.textContent = "_";

            zone.appendChild(span);
        }
    }

    function afficherInfos() {
        document.getElementById("Erreurs").textContent = erreurs;
        document.getElementById("LongueurMot").textContent = motSecret.length;
        document.getElementById("Lettres").textContent = "Lettres essayees: " + lettresEssayees.join(", ");
    }

    function verifierVictoire() {
        for (let i = 0; i < motSecret.length; i++) {
            if (!lettresTrouvees.includes(motSecret[i])) {
                return false;
            }
        }
        return true;
    }

    function proposer() {
        if (fini) return;

        let input = document.getElementById("Lettre");
        let lettre = input.value.trim().toUpperCase();
        input.value = "";
        input.focus();

        if (lettre.length !== 1) {
            afficherMessage("Entre une seule lettre.", "err");
            return;
        }

        if (lettresEssayees.includes(lettre)) {
            afficherMessage("Deja essayee.", "err");
            return;
        }

        lettresEssayees.push(lettre);

        // A COMPLETER:
        // Si motSecret contient la lettre:
        // - ajoute-la dans lettresTrouvees
        // - affiche un message positif
        // Sinon:
        // - ajoute 1 a erreurs
        // - affiche un message d'erreur

        afficherMot();
        afficherInfos();

        if (verifierVictoire()) {
            fini = true;
            afficherMessage("Bravo, tu as trouve le mot !", "ok");
        }

        if (erreurs >= 7) {
            fini = true;
            afficherMessage("Perdu ! Le mot etait " + motSecret + ".", "err");
        }
    }

    function nouvellePartie() {
        motSecret = choisirMot();
        lettresTrouvees = [];
        lettresEssayees = [];
        erreurs = 0;
        fini = false;
        afficherMot();
        afficherInfos();
        afficherMessage("Propose une lettre.", "");
        document.getElementById("Lettre").focus();
    }

    document.getElementById("Lettre").addEventListener("keydown", function(e) {
        if (e.key === "Enter") proposer();
    });

    nouvellePartie();
    </script>
</body>
</html>
