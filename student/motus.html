<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Motus</title>
    <link rel="stylesheet" href="student-style.css">
</head>
<body>
    <main class="card">
        <div class="top">
            <h1>Motus</h1>
            <a href="index.html" class="back">Retour</a>
        </div>
        <p class="sub">Trouve le mot secret en 6 essais.</p>

        <div id="Grille" class="grid"></div>

        <div class="actions">
            <input id="Tentative" maxlength="5" placeholder="Mot de 5 lettres">
            <div style="display:flex;gap:8px">
                <button class="primary" onclick="valider()">Valider</button>
                <button class="secondary" onclick="nouvellePartie()">Rejouer</button>
            </div>
        </div>

        <div id="Message" class="msg"></div>
        <div id="Historique" class="letters"></div>
    </main>

    <script>
    // ============================================================
    // Mini Motus - version eleve
    // ============================================================

    function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    const mots = ["TABLE", "CHIEN", "PLAGE", "ROUTE", "LAMPE", "LIVRE", "FLEUR", "NUAGE"];

    let motSecret = "";
    let essai = 0;
    let fini = false;
    let historiqueLettres = [];

    function choisirMot() {
        // A COMPLETER:
        // Choisis un mot au hasard dans le tableau mots.
        // Astuce: mots[randomInt(0, mots.length - 1)]
        return "TABLE";
    }

    function creerGrille() {
        let grille = document.getElementById("Grille");
        grille.innerHTML = "";

        for (let ligne = 0; ligne < 6; ligne++) {
            let row = document.createElement("div");
            row.className = "row";

            for (let colonne = 0; colonne < 5; colonne++) {
                let c = document.createElement("div");
                c.className = "case";
                row.appendChild(c);
            }

            grille.appendChild(row);
        }
    }

    function afficherMessage(texte, type) {
        let message = document.getElementById("Message");
        message.textContent = texte;
        message.className = "msg " + type;
    }

    function ajouterHistorique(lettres) {
        for (let l of lettres) {
            if (!historiqueLettres.includes(l)) {
                historiqueLettres.push(l);
            }
        }
        document.getElementById("Historique").textContent = "Lettres utilisees: " + historiqueLettres.join(", ");
    }

    function nettoyer(mot) {
        return mot.trim().toUpperCase();
    }

    function afficherMot(mot) {
        let grille = document.getElementById("Grille");
        let ligne = grille.children[essai];

        for (let i = 0; i < 5; i++) {
            let caseLettre = ligne.children[i];
            let lettre = mot[i];

            caseLettre.textContent = lettre;
            caseLettre.classList.add("pop");

            // A COMPLETER:
            // Si la lettre est exactement a la bonne position: classe "case bon"
            // Sinon si la lettre existe dans le mot secret: classe "case presque"
            // Sinon: classe "case faux"
            caseLettre.className = "case pop faux";
        }
    }

    function valider() {
        if (fini) return;

        let input = document.getElementById("Tentative");
        let mot = nettoyer(input.value);
        input.value = "";

        if (mot.length !== 5) {
            afficherMessage("Il faut entrer un mot de 5 lettres.", "err");
            return;
        }

        ajouterHistorique(mot);
        afficherMot(mot);

        // A COMPLETER:
        // Si mot est egal a motSecret, afficher la victoire et terminer la partie.

        essai++;

        // A COMPLETER:
        // Si essai arrive a 6, afficher la defaite et terminer la partie.

        afficherMessage("Continue ! Essai " + (essai + 1) + " sur 6.", "");
    }

    function nouvellePartie() {
        motSecret = choisirMot();
        essai = 0;
        fini = false;
        historiqueLettres = [];
        document.getElementById("Historique").textContent = "";
        creerGrille();
        afficherMessage("A toi de jouer.", "");
        document.getElementById("Tentative").focus();
    }

    document.getElementById("Tentative").addEventListener("keydown", function(e) {
        if (e.key === "Enter") valider();
    });

    nouvellePartie();
    </script>
</body>
</html>
